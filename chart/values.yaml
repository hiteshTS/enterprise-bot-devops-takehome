replicaCount: 2

image:
  repository: enterprise-bot
  tag: "1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

config:
  appName: enterprise-bot
  version: "1.0.0"

ingress:
  enabled: true
  className: nginx
  host: demo.local

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
